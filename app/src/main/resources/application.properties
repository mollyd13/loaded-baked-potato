spring.application.name=app
server.port=8081

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:primary}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Spring Session Configuration
server.servlet.session.timeout=30m
# Session tracking mode (COOKIE = use JSESSIONID cookie)
server.servlet.session.tracking-modes=COOKIE

# Session Cookie Security Settings
# HttpOnly: Not accessible via JavaScript (prevents XSS attacks)
server.servlet.session.cookie.http-only=true
# SameSite: Prevent CSRF by restricting cookie to same-origin
server.servlet.session.cookie.same-site=strict
# Secure: Only send cookie over HTTPS (set to true in production)
server.servlet.session.cookie.secure=false