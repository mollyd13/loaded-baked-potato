<mat-toolbar>
  <div class="display-left">
      <button
        mat-icon-button
        (click)="sidenav.toggle()" class="nav-button"
        >
        <mat-icon> menu </mat-icon>
      </button>
        <div class="app-title-container">
          <mat-icon>trending_up</mat-icon>
          <div class = "text-container">
            <span class="app-title">Matador</span>
            <span class="app-subtitle">Catchy Slogan</span>
          </div>
        </div>

  </div>
  
  <div class="display-right">
    <div class="profile-link" routerLink="/profile">
      <button mat-icon-button>
        <mat-icon style="color: white; cursor: pointer;">account_circle</mat-icon>
      </button>
      <div class="username-container">
        <h3 class="username">{{ auth.currentUser()?.firstName }} {{ auth.currentUser()?.lastName }}</h3>
        <h4 class="user-role">{{ auth.currentUser()?.roleType }}</h4>
      </div>
    </div>
    <button mat-icon-button class="sign-out-button" (click)="signOut()" title="Sign out" aria-label="Sign out">
      <mat-icon>logout</mat-icon>
    </button>
  </div>
</mat-toolbar>
<mat-sidenav-container>
  <mat-sidenav
    [mode]="sidenavMode"
    [opened]="sidenavMode === 'side'"
    [disableClose]="sidenavMode === 'side'"
  >
    <!-- <mat-nav-list> -->
    <mat-list-item>
      <a routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="menu-icons" routerLink="/dashboard">
        <mat-icon>house</mat-icon>
        <span>Home</span>
      </a>
    </mat-list-item>
    <mat-list-item>
      <a routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="menu-icons" routerLink="/history">
        <mat-icon>history</mat-icon>
        <span>History</span>
      </a>
    </mat-list-item>
    <mat-list-item>
      <a routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="menu-icons" routerLink="/trade">
        <mat-icon>show_chart</mat-icon>
        <span>Trade</span>
      </a>
    </mat-list-item>
    <mat-list-item>
      <a routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="menu-icons" routerLink="/profile">
        <mat-icon>person_outline</mat-icon>
        <span>Profile</span>
      </a>
    </mat-list-item>
    <mat-list-item>
      <a class="menu-icons sign-out-link" (click)="signOut()">
        <mat-icon>logout</mat-icon>
        <span>Sign Out</span>
      </a>
    </mat-list-item>
    <!-- </mat-nav-list> -->
  </mat-sidenav>
  <mat-sidenav-content>
      <div class="content mat-elevation-z8">
      <router-outlet></router-outlet>
    </div>
    
  </mat-sidenav-content>
</mat-sidenav-container>
