<div class="auth-page">
  <div class="bubble bubble-1"></div>
  <div class="bubble bubble-2"></div>
  <div class="bubble bubble-3"></div>

  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="auth-subtitle">Join us — it only takes a minute</p>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="error form-error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <div class="field">
        <label for="firstName">First Name</label>
        <input id="firstName" type="text" formControlName="firstName" autocomplete="given-name" placeholder="Jane" />
        <div class="error" *ngIf="submitted && f['firstName'].errors">
          First name is required.
        </div>
      </div>

      <div class="field">
        <label for="lastName">Last Name</label>
        <input id="lastName" type="text" formControlName="lastName" autocomplete="family-name" placeholder="Doe" />
        <div class="error" *ngIf="submitted && f['lastName'].errors">
          Last name is required.
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
        <div class="error" *ngIf="submitted && f['email'].errors">
          Enter a valid email address.
        </div>
      </div>

      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" type="tel" formControlName="phone" autocomplete="tel" placeholder="(555) 123-4567" />
        <div class="error" *ngIf="submitted && f['phone'].errors">
          Enter a valid phone number.
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="new-password" placeholder="••••••••" />
        <div class="error" *ngIf="submitted && f['password'].errors">
          Password must be 8 to 72 characters.
        </div>
      </div>

      <button type="submit" [disabled]="loading">{{ loading ? 'Creating account…' : 'Sign Up' }}</button>

      <p class="switch-link">
        Already have an account? <a routerLink="/sign-in">Sign In</a>
      </p>
    </form>
  </div>
</div>
