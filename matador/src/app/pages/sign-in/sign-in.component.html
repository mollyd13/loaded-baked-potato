<div class="auth-page">
  <div class="bubble bubble-1"></div>
  <div class="bubble bubble-2"></div>
  <div class="bubble bubble-3"></div>

  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="auth-subtitle">Sign in to continue to your account</p>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
        <div class="error" *ngIf="submitted && f['email'].errors">
          Enter a valid email address.
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
        <div class="error" *ngIf="submitted && f['password'].errors">
          Password is required.
        </div>
      </div>

      <button type="submit">Sign In</button>

      <p class="switch-link">
        Don't have an account? <a routerLink="/sign-up">Sign Up</a>
      </p>
    </form>
  </div>
</div>
